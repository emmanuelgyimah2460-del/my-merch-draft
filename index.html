<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Merch Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header>
        <div class="logo">MyMerch</div>

        <nav>
            <a href="#">HOME</a>
            <a href="#">SHOP</a>
            <a href="#">APPAREL</a>
            <a href="#">CONTACT</a>
            <a href="#">TRACK ORDER</a>
        </nav>

        <div class="cart">
            🛒 <span id="cart-count">0</span>
        </div>
    </header>


    <!-- HERO -->
    <section class="hero">
        <h1>My Merch</h1>
        <p>Official Collection</p>
    </section>


    <!-- PRODUCTS -->
    <main class="products">

        <div class="product">
            <img src="images/blackhoodie.png" alt="Black Hoodie">

            <h2>Three-Panel Fleece Hoodie</h2>

            <p>$51.08 – $57.70</p>

            <button onclick="addToCart()">
                ADD TO CART
            </button>
        </div>


        <div class="product">
            <img src="images/blackhoodie.png" alt="Black Sweatshirt">

            <h2>Heavy Blend Crewneck</h2>

            <p>$40.84 – $57.16</p>

            <button onclick="addToCart()">
                ADD TO CART
            </button>
        </div>


        <div class="product">
            <img src="images/blackhoodie.png" alt="Black T-Shirt">

            <h2>Softstyle T-Shirt</h2>

            <p>$28.23 – $42.91</p>

            <button onclick="addToCart()">
                ADD TO CART
            </button>
        </div>


        <div class="product">
            <img src="images/blackhoodie.png" alt="Long Sleeve Shirt">

            <h2>Ultra Cotton Long Sleeve</h2>

            <p>$33.13 – $46.24</p>

            <button onclick="addToCart()">
                ADD TO CART
            </button>
        </div>

    </main>


    <footer>
        <p>© 2026 My Merch. All rights reserved.</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
